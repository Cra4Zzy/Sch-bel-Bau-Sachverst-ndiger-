name: Apply final light theme

on:
  push:
    paths:
      - '.github/scripts/apply_final_light_theme.py'

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final customer color and hero adjustments
        run: python .github/scripts/apply_final_light_theme.py
      - name: Commit final website version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Lighten navy theme and hero image"
          git push
